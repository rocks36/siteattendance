name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate valid app icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          ICON_BASE64="iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
          echo "$ICON_BASE64" | base64 --decode > android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          echo "$ICON_BASE64" | base64 --decode > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          echo "$ICON_BASE64" | base64 --decode > android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          echo "$ICON_BASE64" | base64 --decode > android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          echo "$ICON_BASE64" | base64 --decode > android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
